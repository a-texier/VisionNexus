[pytest]
# ============================================================
# pytest.ini — Configuration globale des tests Annotation App
# ============================================================

testpaths = backend/tests

markers =
    unit:        Tests unitaires rapides (pas de reseau, pas de processus)
    integration: Tests d'integration — demarrent de vrais backends uvicorn
    multiuser:   Sous-ensemble des tests integration — N instances simultanees
    slow:        Tests longs (> 30s)

addopts = -v --tb=short -m "not integration and not multiuser and not slow"

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
