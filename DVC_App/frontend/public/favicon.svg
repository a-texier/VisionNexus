<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0f172a"/>
  <!-- Git branch icon -->
  <!-- Main vertical line -->
  <line x1="11" y1="8" x2="11" y2="24" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <!-- Branch line -->
  <line x1="11" y1="13" x2="20" y2="10" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Commit dots -->
  <circle cx="11" cy="8"  r="2.8" fill="#d97706"/>
  <circle cx="11" cy="24" r="2.8" fill="#d97706"/>
  <circle cx="21" cy="10" r="2.8" fill="#fbbf24"/>
  <!-- Small dot on branch line midpoint -->
  <circle cx="11" cy="16" r="1.4" fill="#92400e"/>
</svg>
