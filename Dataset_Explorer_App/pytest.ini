[pytest]
# ============================================================
# pytest.ini — Configuration globale des tests Dataset Explorer
# ============================================================

# Dossiers de tests
testpaths = backend/tests

# Markers personnalises
markers =
    unit:        Tests unitaires rapides (pas de reseau, pas de processus)
    integration: Tests d'integration — demarrent de vrais backends uvicorn
    multiuser:   Sous-ensemble des tests integration — 10 instances simultanees
    slow:        Tests longs (> 30s)

# Raccourcis
addopts = -v --tb=short

# Filtres d'avertissement
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
