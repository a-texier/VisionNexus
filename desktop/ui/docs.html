<!DOCTYPE html>
<html lang="fr">
<!-- lang= et tout le texte de cette page sont mis a jour en direct par i18n.js
     (cvApplyI18n) : la fenetre s'ouvre dans la langue de VisionNexus (query
     ?lang=) et garde ensuite son propre bouton FR/EN local, comme les apps. -->
<head>
<meta charset="UTF-8">
<title>VisionNexus - Documentation</title>
<style>
:root{
  color-scheme: dark;
  --bg:#0a0e14; --bg2:#0d1420; --panel:#111826; --panel2:#161f30;
  --border:#232f42; --text:#dbe4f0; --muted:#7d8ba3; --muted2:#556279;
  --blue:#58a6ff; --teal:#2dd4bf; --green:#3fb950; --amber:#e3b341;
  --red:#f85149; --purple:#bc8cff;
  --mono:'SF Mono',Consolas,'Cascadia Code',Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:radial-gradient(ellipse 80% 50% at 50% -10%, #132038 0%, var(--bg) 55%);
  color:var(--text); font-family:var(--sans); line-height:1.65; font-size:15.5px;
}
a{color:var(--blue);}
code{background:#0d1420; border:1px solid var(--border); padding:0.1em 0.45em; border-radius:5px; font-size:0.88em; color:var(--teal); font-family:var(--mono);}
pre{
  background:#05070a; border:1px solid var(--border); border-radius:10px; padding:14px 16px;
  overflow-x:auto; font-family:var(--mono); font-size:12.5px; color:#a9c1e0; line-height:1.6;
}
pre code{background:none; border:none; padding:0; color:inherit;}
header.hero{padding:40px 24px 24px; text-align:center;}
.kicker{
  display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--teal); background:rgba(45,212,191,.08); border:1px solid rgba(45,212,191,.25);
  padding:5px 13px; border-radius:20px; margin-bottom:18px;
}
h1.title{
  font-size:clamp(24px,4vw,34px); font-weight:800; margin:0 0 12px; line-height:1.2;
  background:linear-gradient(135deg,#fff 20%,#9db4d9 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:-0.02em;
}
.subtitle{color:var(--muted); font-size:15px; max-width:600px; margin:0 auto;}

.docTabs{display:flex; gap:8px; justify-content:center; margin-top:24px;}
.docTabs button{
  appearance:none; border:1px solid var(--border); background:var(--panel); color:var(--muted);
  font-weight:700; font-size:12.5px; padding:9px 20px; border-radius:9px; cursor:pointer;
}
.docTabs button.active{color:#fff; border-color:var(--blue); background:rgba(88,166,255,.12);}
#docsLangToggle{position:fixed; top:14px; right:18px; z-index:60; display:flex; gap:4px;}
#docsLangToggle button{
  appearance:none; border:1px solid var(--border); background:var(--panel2); color:var(--muted);
  font-weight:700; font-size:11px; padding:6px 12px; border-radius:7px; cursor:pointer;
}
#docsLangToggle button.active{color:#fff; border-color:var(--blue); background:rgba(88,166,255,.14);}

/* ---- Barre de navigation : historique + resultats de recherche ---- */
#navBar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:8px 110px 8px 18px; background:rgba(11,16,26,.94); border-bottom:1px solid var(--border);
  font-size:12px; color:var(--muted);
}
#navBar button{
  appearance:none; border:1px solid var(--border); background:var(--panel2); color:var(--text);
  border-radius:7px; padding:5px 11px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit;
}
#navBar button:hover:not(:disabled){border-color:var(--blue);}
#navBar button:disabled{opacity:.35; cursor:default;}
#navBar button[hidden], #navBar span[hidden]{display:none;}
#navBar .navSep{width:1px; height:18px; background:var(--border);}
#navResult{display:flex; align-items:center; gap:8px; min-width:0;}
#navResCount{color:var(--text); font-weight:700; white-space:nowrap;}
#navResTitle{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:34ch;}
.askRecent{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:-4px 0 12px; font-size:11.5px; color:var(--muted2);}
.askRecent .chip{padding:3px 10px; font-size:11.5px; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.askRecent .clearRecent{background:none; border:none; color:var(--muted2); text-decoration:underline; cursor:pointer; font:inherit; padding:0 4px;}

h2{font-size:clamp(21px,3vw,27px); margin:0 0 12px; letter-spacing:-0.01em; font-weight:800;}
h3{font-size:16.5px; margin:22px 0 8px; color:#eef2f9;}
p{color:#b9c4d6; margin:0 0 14px;}
ul,ol{color:#b9c4d6; padding-left:20px;}
li{margin-bottom:6px;}
strong{color:#fff;}
table{width:100%; border-collapse:collapse; margin:16px 0; font-size:13px;}
th,td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--border);}
th{color:var(--muted); font-weight:700; font-size:11px; text-transform:uppercase;}
td{color:#c3cee0;}
footer{padding:40px 24px 70px; text-align:center; color:var(--muted2); font-size:12.5px;}

/* ---- Onglet Apps ---- */
#appsPanel{display:none;}
#appsPanel.active{display:block;}
.appsLayout{display:flex; max-width:1080px; margin:0 auto; padding:24px; gap:0; align-items:flex-start;}
#appList{width:210px; flex-shrink:0; display:flex; flex-direction:column; gap:4px; position:sticky; top:70px;}
#appList button{
  appearance:none; border:1px solid transparent; background:none; color:var(--muted); text-align:left;
  padding:9px 12px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600;
  display:flex; align-items:center; gap:9px;
}
#appList button img{width:18px; height:18px; object-fit:contain; opacity:.8;}
#appList button:hover{background:var(--panel2); color:var(--text);}
#appList button.active{background:rgba(88,166,255,.1); border-color:rgba(88,166,255,.3); color:#fff;}
#appList button .count{margin-left:auto; font-size:10.5px; color:var(--muted2);}
#appMain{flex:1; min-width:0; padding-left:28px; border-left:1px solid var(--border);}
#appFileTabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;}
#appFileTabs button{
  appearance:none; border:1px solid var(--border); background:var(--panel); color:var(--muted);
  font-size:11.5px; font-weight:600; padding:6px 12px; border-radius:7px; cursor:pointer;
}
#appFileTabs button.active{color:#fff; border-color:var(--teal); background:rgba(45,212,191,.1);}
#appDocBody h1{font-size:22px; margin:0 0 14px; color:#fff;}
#appDocBody h2{font-size:18px; margin:26px 0 10px;}
#appDocBody h3{font-size:15px; margin:20px 0 8px;}
#appDocBody blockquote{
  margin:14px 0; padding:8px 16px; border-left:3px solid var(--amber); background:rgba(227,179,65,.06);
  color:#c3cee0; border-radius:0 6px 6px 0;
}
#appDocBody hr{border:none; border-top:1px solid var(--border); margin:26px 0;}
#appDocBody h4{font-size:13.5px; margin:16px 0 6px; color:#eef2f9;}
#appDocBody [id^="h-"]{scroll-margin-top:16px;}
#appDocBody li > ul, #appDocBody li > ol{margin:6px 0 0;}
#appDocBody li > p{margin:0 0 6px;}
#appDocBody table{display:block; width:max-content; max-width:100%; overflow-x:auto;}
#appDocBody td code, #appDocBody th code{white-space:nowrap;}
#appDocBody img{max-width:100%;}
#appDocBody .imgAlt{color:var(--muted2);}
.emptyState{color:var(--muted2); font-size:13.5px; padding:30px 0;}
#appDocBody .hFlash{animation:hFlash 1.6s ease-out;}
@keyframes hFlash{0%{background:rgba(45,212,191,.28);}100%{background:transparent;}}

/* ---- Onglet "Demander a la doc" ---- */
[hidden]{display:none !important;}
#askPanel{display:none;}
#askPanel.active{display:block;}
.askWrap{max-width:880px; margin:0 auto; padding:24px 24px 40px;}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
.svcBar{
  display:flex; align-items:center; gap:12px; min-height:56px; padding:10px 14px;
  background:var(--panel); border:1px solid var(--border); border-radius:12px;
}
.svcBar > img{width:30px; height:30px; object-fit:contain; flex-shrink:0;}
.svcInfo{flex:1; min-width:0;}
.svcName{font-weight:700; font-size:13.5px; color:#fff; line-height:1.3;}
.svcMeta{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); min-width:0; flex-wrap:wrap;}
.dot{width:8px; height:8px; border-radius:50%; background:var(--muted2); flex-shrink:0;}
.dot.starting, .dot.stopping{background:var(--blue); animation:pulse 1s ease-in-out infinite;}
.dot.ready{background:var(--green); box-shadow:0 0 6px rgba(63,185,80,.6);}
.dot.error{background:var(--red);}
.targetChip{
  font-size:10.5px; font-weight:700; color:var(--teal); background:rgba(45,212,191,.1);
  border:1px solid rgba(45,212,191,.3); padding:1px 8px; border-radius:20px;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
@keyframes spin{to{transform:rotate(360deg);}}
.linkBtn{background:none; border:none; padding:0 2px; color:var(--accent, #58a6ff); font:inherit; font-size:11.5px; cursor:pointer; text-decoration:underline;}
.linkBtn:disabled{opacity:.5; cursor:default; text-decoration:none;}
.switch{
  position:relative; flex-shrink:0; width:44px; height:24px; padding:0; border-radius:12px; cursor:pointer;
  border:1px solid var(--border); background:var(--panel2); transition:background .15s, border-color .15s;
}
.switch::after{
  content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
  background:var(--muted); transition:left .15s, background .15s;
}
.switch[aria-checked="true"]{background:rgba(63,185,80,.22); border-color:rgba(63,185,80,.55);}
.switch[aria-checked="true"]::after{left:22px; background:var(--green);}
.switch:disabled{opacity:.5; cursor:default;}
.switch:focus-visible, .chip:focus-visible, .seg button:focus-visible, .hitOpen:focus-visible,
.twinLink:focus-visible, .primary:focus-visible, #askInput:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
.svcHint{
  margin-top:8px; padding:8px 12px; font-size:12px; color:var(--amber);
  background:rgba(227,179,65,.08); border:1px solid rgba(227,179,65,.3); border-radius:8px;
}
.askState{
  margin-top:18px; padding:40px 22px; text-align:center; background:var(--panel);
  border:1px dashed var(--border); border-radius:14px;
}
.askState.err{border-color:rgba(248,81,73,.45);}
.askState h3{margin:0 0 8px; font-size:16.5px; color:#fff;}
.askState p{margin:0 auto 10px; max-width:520px; font-size:13.5px; color:var(--muted);}
.askState p.target{color:var(--teal); font-weight:600; font-size:12.5px;}
.askState p.errMsg{color:#f0a19c; overflow-wrap:anywhere;}
.spin{
  width:24px; height:24px; margin:0 auto 14px; border-radius:50%;
  border:3px solid var(--panel2); border-top-color:var(--blue); animation:spin .8s linear infinite;
}
.primary{
  appearance:none; border:none; cursor:pointer; margin-top:6px; padding:9px 22px; border-radius:9px;
  background:var(--blue); color:#031627; font-weight:700; font-size:13px;
}
.primary:hover{filter:brightness(1.1);}
.primary:disabled{opacity:.5; cursor:default;}
.askForm{display:flex; gap:8px; margin:18px 0 14px;}
#askInput{
  flex:1; min-width:0; padding:11px 14px; font-size:14.5px; color:var(--text);
  background:var(--panel2); border:1px solid var(--border); border-radius:10px;
}
#askInput::placeholder{color:var(--muted2);}
.askForm .primary{margin-top:0; flex-shrink:0;}
.askFilters{display:flex; flex-wrap:wrap; gap:12px 26px; align-items:flex-start;}
.filterGroup{display:flex; flex-direction:column; gap:6px; min-width:0;}
.filterGroup.apps{flex:1 1 100%;}
.filterLabel{font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted2);}
.chips{display:flex; flex-wrap:wrap; gap:6px; min-height:30px;}
.chip{
  appearance:none; display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:20px;
  border:1px solid var(--border); background:var(--panel); color:var(--muted); font-size:12px; font-weight:600; cursor:pointer;
}
.chip img{width:14px; height:14px; object-fit:contain;}
.chip:hover{color:var(--text); background:var(--panel2);}
.chip[aria-pressed="true"]{color:#fff; border-color:var(--blue); background:rgba(88,166,255,.14);}
.seg{display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--panel);}
.seg button{
  appearance:none; border:none; background:none; color:var(--muted); font-size:12px; font-weight:600;
  padding:6px 13px; cursor:pointer; border-right:1px solid var(--border);
}
.seg button:last-child{border-right:none;}
.seg button:hover{color:var(--text); background:var(--panel2);}
.seg button[aria-pressed="true"]{color:#fff; background:rgba(88,166,255,.16);}
.askNote{
  margin:12px 0 0; padding:8px 12px; font-size:12.5px; color:var(--amber);
  background:rgba(227,179,65,.08); border:1px solid rgba(227,179,65,.3); border-radius:8px;
}
.askNote.low{color:#f0c674; background:rgba(227,179,65,.06);}
.askState .errDetail{margin:10px auto 0; max-width:560px; text-align:left; font-size:11.5px; color:var(--muted);}
.askState .errDetail summary{cursor:pointer; color:var(--muted); text-align:center;}
.askState .errDetail pre{margin:8px 0 0; padding:8px 10px; white-space:pre-wrap; overflow-wrap:anywhere;}
.askMeta{margin:14px 0 2px; min-height:20px; font-size:12px; color:var(--muted);}
.askInitial{margin:26px 0; text-align:center; color:var(--muted2); font-size:13.5px;}
.askErr{
  margin:12px 0; padding:10px 14px; font-size:13px; color:#f0a19c;
  background:rgba(248,81,73,.08); border:1px solid rgba(248,81,73,.35); border-radius:8px; overflow-wrap:anywhere;
}
.askEmpty{margin:22px 0; padding:26px 22px; text-align:center; border:1px dashed var(--border); border-radius:12px;}
.askEmpty h3{margin:0 0 8px; font-size:15.5px; color:#fff; overflow-wrap:anywhere;}
.askEmpty p{margin:0 auto; max-width:540px; font-size:13px; color:var(--muted);}
.hit{background:var(--panel); border:1px solid var(--border); border-radius:12px; margin:10px 0; transition:border-color .12s;}
.hit:hover{border-color:rgba(88,166,255,.45);}
.hitOpen{
  appearance:none; display:block; width:100%; padding:13px 16px 10px; border:none; background:none; color:inherit;
  font:inherit; text-align:left; cursor:pointer; border-radius:12px;
}
.hitHead{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.hitHead img{width:18px; height:18px; object-fit:contain;}
.hitApp{font-size:12px; font-weight:700; color:var(--blue);}
.langBadge{
  font-size:9.5px; font-weight:800; letter-spacing:.05em; color:var(--muted); padding:1px 6px;
  border:1px solid var(--border); border-radius:6px;
}
.hitScore{margin-left:auto; width:64px; height:5px; border-radius:3px; background:var(--panel2); overflow:hidden; flex-shrink:0;}
.hitScore i{display:block; height:100%; background:var(--teal); border-radius:3px;}
.hitTitle{font-size:15px; font-weight:700; color:#fff; line-height:1.35; overflow-wrap:anywhere;}
.hitCrumb{display:flex; flex-wrap:wrap; align-items:center; margin-top:3px; font-size:12px; color:var(--muted);}
.hitCrumb span + span::before{
  content:''; display:inline-block; width:5px; height:5px; margin:0 9px 1px 5px;
  border-top:1.5px solid var(--muted2); border-right:1.5px solid var(--muted2); transform:rotate(45deg);
}
.hitSnippet{margin:8px 0 0; font-size:13.5px; line-height:1.55; color:#b9c4d6; overflow-wrap:anywhere;}
.hitSnippet mark{background:rgba(227,179,65,.22); color:#ffe9a8; border-radius:3px; padding:0 2px;}
.hitTwin{padding:0 16px 11px;}
.twinLink{
  appearance:none; border:none; background:none; padding:0; cursor:pointer; color:var(--teal);
  font-size:12px; font-weight:600; text-decoration:underline; text-underline-offset:3px;
}
.twinLink:hover{color:#7ff0df;}
/* ---- Recherche dans la page (Ctrl+F) ---- */
#findBar{
  position:fixed; top:52px; right:18px; z-index:60; display:flex; align-items:center; gap:6px;
  padding:6px 8px; background:var(--panel); border:1px solid var(--border); border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.45);
}
#findInput{
  width:220px; padding:6px 10px; font-size:13px; color:var(--text); font-family:inherit;
  background:var(--panel2); border:1px solid var(--border); border-radius:7px; outline:none;
}
#findInput:focus{border-color:var(--blue);}
#findInput.none{border-color:rgba(248,81,73,.6);}
#findInput::placeholder{color:var(--muted2);}
#findCount{min-width:44px; text-align:center; font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap;}
#findBar button{
  appearance:none; border:1px solid var(--border); background:var(--panel2); color:var(--text);
  border-radius:7px; width:28px; height:28px; padding:0; font-size:13px; cursor:pointer; font-family:inherit;
}
#findBar button:hover:not(:disabled){border-color:var(--blue);}
#findBar button:disabled{opacity:.35; cursor:default;}
mark.findHit{background:rgba(227,179,65,.3); color:inherit; border-radius:2px;}
mark.findHit.cur{background:var(--amber); color:#1a1300;}
@media (max-width:680px){
  #findBar{left:14px; right:14px;}
  #findInput{flex:1; width:auto; min-width:0;}
  .askWrap{padding:16px 14px 32px;}
  .askForm{flex-wrap:wrap;}
  .askForm #askInput{flex:1 1 100%;}
  .askForm .primary{flex:1;}
  .filterGroup{flex:1 1 100%;}
}
@media (prefers-reduced-motion:reduce){
  .spin, .dot.starting, .dot.stopping, #appDocBody .hFlash{animation:none;}
}
</style>
</head>
<body>

<div id="docsLangToggle">
  <button type="button" id="docsLangEn">EN</button>
  <button type="button" id="docsLangFr">FR</button>
</div>
<header class="hero">
  <div class="kicker" data-i18n="docsKicker">VisionNexus - documentation</div>
  <h1 class="title" data-i18n="docsTitle">Documentation</h1>
  <p class="subtitle" data-i18n="docsSubtitle">La documentation de VisionNexus et de chaque app de la suite, avec une recherche pour poser une question.</p>
  <div class="docTabs">
    <button id="tabApps" class="active" data-i18n="docsTabApps">Docs par app</button>
    <button id="tabAsk" data-i18n="docsTabAsk">Demander a la doc</button>
  </div>
</header>

<nav id="navBar">
  <button type="button" id="navBack" disabled></button>
  <button type="button" id="navFwd" disabled></button>
  <span class="navSep" id="navSep" hidden></span>
  <button type="button" id="navToResults" hidden></button>
  <span id="navResult" hidden>
    <button type="button" id="navPrevRes"></button>
    <span id="navResCount"></span>
    <button type="button" id="navNextRes"></button>
    <span id="navResTitle"></span>
  </span>
</nav>

<div id="appsPanel" class="active">
  <div class="appsLayout">
    <div id="appList"></div>
    <div id="appMain">
      <div id="appFileTabs"></div>
      <div id="appDocBody"><div class="emptyState" data-i18n="docsLoading">Chargement...</div></div>
    </div>
  </div>
</div>

<div id="askPanel">
  <div class="askWrap">
    <div class="svcBar">
      <img src="../assets/icon_docs.png" alt="" onerror="this.style.display='none'">
      <div class="svcInfo">
        <div class="svcName">Docs Assistant</div>
        <div class="svcMeta">
          <span class="dot off" id="askDot"></span>
          <span id="askStatusText"></span>
          <span class="targetChip" id="askTarget"></span>
          <button type="button" class="linkBtn" id="askReindex" data-i18n="askReindexBtn" hidden>Actualiser l'index</button>
        </div>
      </div>
      <button type="button" class="switch" id="askSwitch" role="switch" aria-checked="false"></button>
    </div>
    <div class="svcHint" id="askRetarget" hidden></div>

    <div id="askState"></div>

    <div id="askSearch" hidden>
      <form class="askForm" id="askForm" role="search">
        <label class="sr" for="askInput" data-i18n="askInputLabel">Question</label>
        <input id="askInput" type="text" maxlength="500" autocomplete="off" spellcheck="false"
               placeholder="Ex : comment exporter en YOLO ?" data-i18n-placeholder="askPlaceholder">
        <button type="submit" class="primary" id="askSubmit" data-i18n="askSearchBtn">Chercher</button>
      </form>
      <div class="askRecent" id="askRecent" hidden></div>
      <div class="askFilters">
        <div class="filterGroup apps">
          <span class="filterLabel" data-i18n="askFilterApps">Apps</span>
          <div class="chips" id="askApps"></div>
        </div>
        <div class="filterGroup">
          <span class="filterLabel" data-i18n="askFilterAudience">Public</span>
          <div class="seg" id="askAudience" role="group">
            <button type="button" data-value="all" data-i18n="askAudAll">Tous</button>
            <button type="button" data-value="user" data-i18n="askAudUser">Utilisateur</button>
            <button type="button" data-value="dev" data-i18n="askAudDev">Developpeur</button>
          </div>
        </div>
        <div class="filterGroup">
          <span class="filterLabel" data-i18n="askFilterLang">Langue</span>
          <div class="seg" id="askLang" role="group">
            <button type="button" data-value="fr">FR</button>
            <button type="button" data-value="en">EN</button>
            <button type="button" data-value="both" data-i18n="askLangBoth" data-i18n-title="askLangBothTitle">Les deux</button>
          </div>
        </div>
      </div>
      <div class="askNote" id="askIdxNote" hidden></div>
      <div class="askMeta" id="askMeta" aria-live="polite"></div>
      <div id="askResults"></div>
    </div>
  </div>
</div>

<div id="findBar" role="search" hidden>
  <input id="findInput" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="findPlaceholder">
  <span id="findCount" aria-live="polite"></span>
  <button type="button" id="findPrev" data-i18n-title="findPrevTitle">&#x2191;</button>
  <button type="button" id="findNext" data-i18n-title="findNextTitle">&#x2193;</button>
  <button type="button" id="findClose" data-i18n-title="findCloseTitle">&times;</button>
</div>

<footer data-i18n="docsFooter">VisionNexus -- documentation embarquee</footer>
<script src="i18n.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="doc-render.js"></script>
<script src="ask-render.js"></script>

<script>
// ---- Bascule d'onglet ----
const tabApps = document.getElementById('tabApps')
const tabAsk = document.getElementById('tabAsk')
const appsPanel = document.getElementById('appsPanel')
const askPanel = document.getElementById('askPanel')

function showTab(name) {
  const isApps = name === 'apps'
  const isAsk = name === 'ask'
  tabApps.classList.toggle('active', isApps)
  tabAsk.classList.toggle('active', isAsk)
  appsPanel.classList.toggle('active', isApps)
  askPanel.classList.toggle('active', isAsk)
  if (isAsk) window.askOnShow()
  refreshNav()
  findRefresh()
  return isApps ? loadAppDocs() : Promise.resolve()
}
tabApps.addEventListener('click', () => void showTab('apps'))
tabAsk.addEventListener('click', () => {
  void showTab('ask')
  navRecord({ kind: 'ask', snap: window.askSnapshot() })
})

// ---- Langue : fenetre independante du catalogue (bouton FR/EN local),
// s'ouvre dans la langue de VisionNexus (?lang= passe par main.ts) ----
// Promesse resolue une fois les docs de la nouvelle langue rechargees si l'onglet
// Apps est visible. `research` : relancer la recherche de l'onglet "Demander a
// la doc" (faux quand c'est l'ouverture d'un resultat qui change la langue).
async function setDocsLang(lang, opts) {
  if (CV_LANG === lang) return
  CV_LANG = lang
  cvApplyI18n()
  document.getElementById('docsLangEn').classList.toggle('active', lang === 'en')
  document.getElementById('docsLangFr').classList.toggle('active', lang === 'fr')
  appDocsCache = null   // la langue des docs par app depend du backend (main.ts) -- refetch
  window.askOnLangChange(!opts || opts.research !== false)
  const curView = nav.list[nav.pos]
  if (curView && curView.kind === 'doc') curView.lang = lang
  nav.mute++
  try {
    if (appsPanel.classList.contains('active')) await loadAppDocs()
  } finally {
    nav.mute--
  }
  refreshNav()
}
document.getElementById('docsLangEn').addEventListener('click', () => void setDocsLang('en'))
document.getElementById('docsLangFr').addEventListener('click', () => void setDocsLang('fr'))

// ---- Historique de navigation ----
// Une entree par vue : resultats de recherche (instantane fourni par ask.js) ou
// page de doc (app, page, titre, langue). `ctx` = liste des resultats de la
// recherche dont la page ouverte est issue : elle alimente Precedent/Suivant.
const NAV_MAX = 60
const nav = { list: [], pos: -1, mute: 0, ctx: null }

function navRecord(view) {
  if (nav.mute > 0) return
  if (view.kind === 'ask' && !view.snap.outcome) return   // aucune recherche encore : rien a retrouver
  const cur = nav.list[nav.pos]
  if (cur && cur.kind === view.kind) {
    if (view.kind === 'doc' && cur.appId === view.appId && cur.file === view.file && cur.headingIdx === view.headingIdx) {
      cur.lang = view.lang
      cur.ctx = view.ctx
      refreshNav()
      return
    }
    if (view.kind === 'ask' && cur.snap.query === view.snap.query) {
      cur.snap = view.snap
      refreshNav()
      return
    }
  }
  nav.list.length = nav.pos + 1
  nav.list.push(view)
  if (nav.list.length > NAV_MAX) nav.list.shift()
  nav.pos = nav.list.length - 1
  refreshNav()
}

async function navGo(delta) {
  const target = nav.pos + delta
  if (target < 0 || target >= nav.list.length) return
  nav.pos = target
  const view = nav.list[target]
  nav.mute++
  try {
    if (view.kind === 'ask') {
      window.askRestore(view.snap)
      await showTab('ask')
    } else {
      nav.ctx = view.ctx || null
      if (view.lang && view.lang !== CV_LANG) await setDocsLang(view.lang, { research: false })
      await openDoc(view.appId, view.file, view.headingIdx)
    }
  } finally {
    nav.mute--
  }
  refreshNav()
}

// Ouvre le resultat voisin de la recherche dont la page courante est issue.
async function navResult(delta) {
  if (!nav.ctx) return
  const i = nav.ctx.index + delta
  const hit = nav.ctx.hits[i]
  if (!hit) return
  nav.ctx = { hits: nav.ctx.hits, index: i }
  if (hit.lang && hit.lang !== CV_LANG) await setDocsLang(hit.lang, { research: false })
  await openDoc(hit.app, hit.doc, hit.headingIdx)
}

function refreshNav() {
  const onDoc = appsPanel.classList.contains('active')
  const back = document.getElementById('navBack')
  const fwd = document.getElementById('navFwd')
  back.textContent = '\u2190 ' + cvT('navBack')
  fwd.textContent = cvT('navForward') + ' \u2192'
  back.title = cvT('navBackTitle')
  fwd.title = cvT('navForwardTitle')
  back.disabled = nav.pos <= 0
  fwd.disabled = nav.pos >= nav.list.length - 1
  const inSearch = onDoc && !!nav.ctx
  document.getElementById('navSep').hidden = !inSearch
  const toResults = document.getElementById('navToResults')
  toResults.hidden = !inSearch
  toResults.textContent = cvT('navToResults')
  const res = document.getElementById('navResult')
  res.hidden = !inSearch
  if (inSearch) {
    const { hits, index } = nav.ctx
    document.getElementById('navResCount').textContent = cvT('navResultOf', { i: index + 1, n: hits.length })
    const prev = document.getElementById('navPrevRes')
    const next = document.getElementById('navNextRes')
    prev.textContent = '\u25C0 ' + cvT('navPrevRes')
    next.textContent = cvT('navNextRes') + ' \u25B6'
    prev.title = cvT('navPrevResTitle')
    next.title = cvT('navNextResTitle')
    prev.disabled = index <= 0
    next.disabled = index >= hits.length - 1
    document.getElementById('navResTitle').textContent = hits[index].title || ''
  }
}

document.getElementById('navBack').addEventListener('click', () => void navGo(-1))
document.getElementById('navFwd').addEventListener('click', () => void navGo(1))
document.getElementById('navPrevRes').addEventListener('click', () => void navResult(-1))
document.getElementById('navNextRes').addEventListener('click', () => void navResult(1))
document.getElementById('navToResults').addEventListener('click', () => {
  void showTab('ask')
  navRecord({ kind: 'ask', snap: window.askSnapshot() })
})
document.addEventListener('keydown', (ev) => {
  if (!ev.altKey || ev.ctrlKey || ev.metaKey || ev.shiftKey) return
  const action = { ArrowLeft: () => navGo(-1), ArrowRight: () => navGo(1), ArrowUp: () => navResult(-1), ArrowDown: () => navResult(1) }[ev.key]
  if (!action) return
  ev.preventDefault()
  void action()
})
// Boutons precedent / suivant de la souris.
document.addEventListener('mouseup', (ev) => {
  if (ev.button !== 3 && ev.button !== 4) return
  ev.preventDefault()
  void navGo(ev.button === 3 ? -1 : 1)
})
window.docNav = {
  setResultCtx(ctx) { nav.ctx = ctx },
  recordAsk() { navRecord({ kind: 'ask', snap: window.askSnapshot() }) },
}

// ---- Onglet Apps ----
// Rendu markdown : marked (ui/vendor/marked.min.js) + doc-render.js, qui pose
// les ancres h-<n> communes au lint et au Docs Assistant.
let appDocsCache = null
let activeAppId = null
let activeFile = null          // nom de base ('user-guide') : survit au changement de langue
let pendingHeadingIdx = null   // ancre a atteindre au prochain rendu (openDoc)

// Charge la liste des docs dans la langue courante. Si la langue change pendant
// l'attente, la reponse est perimee : on recommence plutot que de la ranger.
async function ensureAppDocs() {
  while (!appDocsCache) {
    const lang = CV_LANG
    const docs = await window.cvDocs.listAppDocs(lang)
    if (lang === CV_LANG && !appDocsCache) {
      appDocsCache = docs
      renderAppList()
    }
  }
  return appDocsCache
}

async function loadAppDocs() {
  await ensureAppDocs()
  const current = appDocsCache.find((e) => e.appId === activeAppId)
  const target = current || appDocsCache.find((e) => e.files.length) || appDocsCache[0]
  if (target) selectApp(target.appId)
}

function renderAppList() {
  const list = document.getElementById('appList')
  list.innerHTML = ''
  for (const entry of appDocsCache) {
    const btn = document.createElement('button')
    btn.innerHTML = `<img src="../assets/${entry.icon}" onerror="this.style.display='none'"><span>${entry.label}</span><span class="count">${entry.files.length || ''}</span>`
    btn.addEventListener('click', () => { nav.ctx = null; activeFile = null; selectApp(entry.appId) })
    list.appendChild(btn)
  }
}

function selectApp(appId) {
  activeAppId = appId
  document.querySelectorAll('#appList button').forEach((b, idx) => {
    b.classList.toggle('active', appDocsCache[idx].appId === appId)
  })
  renderFileTabs()
}

function activeFileIdx(entry) {
  const idx = entry.files.findIndex((f) => f.file === activeFile)
  return idx >= 0 ? idx : 0
}

function renderFileTabs() {
  const entry = appDocsCache.find((e) => e.appId === activeAppId)
  const tabsEl = document.getElementById('appFileTabs')
  tabsEl.innerHTML = ''
  if (!entry || !entry.files.length) {
    tabsEl.style.display = 'none'
    document.getElementById('appDocBody').innerHTML = `<div class="emptyState">${cvT('docsAppsEmpty')}</div>`
    return
  }
  tabsEl.style.display = 'flex'
  const current = activeFileIdx(entry)
  activeFile = entry.files[current].file
  entry.files.forEach((f, idx) => {
    const btn = document.createElement('button')
    btn.textContent = f.title
    btn.className = idx === current ? 'active' : ''
    btn.addEventListener('click', () => { nav.ctx = null; activeFile = f.file; renderFileTabs() })
    tabsEl.appendChild(btn)
  })
  renderDocBody()
}

function renderDocBody() {
  const entry = appDocsCache.find((e) => e.appId === activeAppId)
  const file = entry && entry.files[activeFileIdx(entry)]
  const body = document.getElementById('appDocBody')
  body.innerHTML = file ? cvDocRender.renderDoc(marked, file.content, file.baseUrl) : ''
  const shownHeading = pendingHeadingIdx
  const anchor = pendingHeadingIdx === null ? null : document.getElementById(cvDocRender.headingId(pendingHeadingIdx))
  pendingHeadingIdx = null
  findRefresh()
  if (file) navRecord({ kind: 'doc', appId: activeAppId, file: file.file, headingIdx: shownHeading, lang: CV_LANG, ctx: nav.ctx })
  if (anchor) {
    // instant : un defilement anime sur plusieurs milliers de pixels peut etre interrompu par un reflow.
    anchor.scrollIntoView({ block: 'start', behavior: 'instant' })
    anchor.classList.remove('hFlash')
    void anchor.offsetWidth   // relance l'animation si la meme section est rouverte
    anchor.classList.add('hFlash')
  }
}

// Ouvre une page d'app, et optionnellement un titre (index h-<n>), depuis
// n'importe quel onglet. Point d'entree des liens entre pages et de la
// recherche ; file absent ou inconnu = premiere page de l'app.
async function openDoc(appId, file, headingIdx) {
  activeAppId = appId
  activeFile = file || null
  pendingHeadingIdx = Number.isInteger(headingIdx) ? headingIdx : null
  const hasAnchor = pendingHeadingIdx !== null
  await showTab('apps')
  if (!hasAnchor) window.scrollTo(0, 0)
}
window.openDoc = openDoc

// Liens markdown vers une autre page de la meme app (cf. doc-render.js).
document.getElementById('appDocBody').addEventListener('click', (ev) => {
  const link = ev.target.closest('a[data-doc-file]')
  if (!link) return
  ev.preventDefault()
  nav.ctx = null
  const m = /^h-(\d+)$/.exec(link.dataset.docAnchor)
  const target = link.dataset.docDir ? appDocsCache.find((e) => e.dir === link.dataset.docDir) : null
  if (link.dataset.docDir && !target) return
  void openDoc(target ? target.appId : activeAppId, link.dataset.docFile || activeFile, m ? Number(m[1]) : null)
})

// ---- Recherche dans la page (Ctrl+F) ----
// Surlignage DOM (TreeWalker + <mark>) plutot que webContents.findInPage :
// findInPage compte aussi le texte tape dans le champ de recherche et balaie
// toute la fenetre (liste des apps, barre de nav). Ici on ne cherche que dans
// le contenu affiche, sans aller-retour IPC. Limite assumee : une occurrence
// coupee par une mise en forme ("foo **bar**") n'est pas trouvee.
const findBar = document.getElementById('findBar')
const findInput = document.getElementById('findInput')
const find = { hits: [], idx: -1 }

function findScope() {
  return document.getElementById(appsPanel.classList.contains('active') ? 'appDocBody' : 'askResults')
}

function findClear() {
  for (const mark of document.querySelectorAll('mark.findHit')) {
    const parent = mark.parentNode
    parent.replaceChild(document.createTextNode(mark.textContent), mark)
    parent.normalize()   // recolle les morceaux pour que la recherche suivante voie le texte entier
  }
  find.hits = []
  find.idx = -1
}

function findRun() {
  findClear()
  const needle = findInput.value.toLowerCase()
  if (needle) {
    // Noeuds collectes avant de decouper : splitText pendant le parcours derouterait le walker.
    const walker = document.createTreeWalker(findScope(), NodeFilter.SHOW_TEXT)
    const nodes = []
    while (walker.nextNode()) nodes.push(walker.currentNode)
    for (let node of nodes) {
      // Rare (ex. "I" pointe turc) : la minuscule change la longueur, les indices ne collent plus.
      if (node.data.toLowerCase().length !== node.data.length) continue
      let i
      while ((i = node.data.toLowerCase().indexOf(needle)) >= 0) {
        const match = node.splitText(i)
        node = match.splitText(needle.length)
        const mark = document.createElement('mark')
        mark.className = 'findHit'
        match.parentNode.replaceChild(mark, match)
        mark.appendChild(match)
        find.hits.push(mark)
      }
    }
  }
  findShowCount()
}

function findShowCount() {
  const n = find.hits.length
  document.getElementById('findCount').textContent = findInput.value ? `${find.idx + 1}/${n}` : ''
  findInput.classList.toggle('none', !!findInput.value && n === 0)
  document.getElementById('findPrev').disabled = n === 0
  document.getElementById('findNext').disabled = n === 0
}

function findGo(delta) {
  // Contenu re-rendu entre-temps (ex. nouveaux resultats de l'onglet Demander) : marques detachees.
  if (find.hits.length && !find.hits[0].isConnected) findRun()
  const n = find.hits.length
  if (!n) return
  if (find.hits[find.idx]) find.hits[find.idx].classList.remove('cur')
  find.idx = find.idx < 0 ? (delta > 0 ? 0 : n - 1) : (find.idx + delta + n) % n
  const cur = find.hits[find.idx]
  cur.classList.add('cur')
  cur.scrollIntoView({ block: 'center', behavior: 'instant' })
  findShowCount()
}

// Apres un changement de page ou d'onglet : on resurligne sans defiler, pour
// ne pas contrarier le saut vers une ancre.
function findRefresh() {
  if (!findBar.hidden) findRun()
}

function findOpen() {
  findBar.hidden = false
  findInput.focus()
  findInput.select()
  if (findInput.value && !find.hits.length) findRun()
}

function findClose() {
  findClear()
  findBar.hidden = true
}

findInput.addEventListener('input', () => { findRun(); findGo(1) })
findInput.addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter') return
  ev.preventDefault()
  findGo(ev.shiftKey ? -1 : 1)
})
document.getElementById('findPrev').addEventListener('click', () => findGo(-1))
document.getElementById('findNext').addEventListener('click', () => findGo(1))
document.getElementById('findClose').addEventListener('click', findClose)
document.addEventListener('keydown', (ev) => {
  if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && !ev.shiftKey && ev.key.toLowerCase() === 'f') {
    ev.preventDefault()
    findOpen()
  } else if (ev.key === 'Escape' && !findBar.hidden) {
    ev.preventDefault()
    findClose()
  }
})

// ---- Init : langue de depart = celle de VisionNexus au moment de l'ouverture
// (query ?lang= posee par main.ts::openDocsWindow), avant tout rendu.
CV_LANG = new URLSearchParams(location.search).get('lang') === 'fr' ? 'fr' : 'en'
document.getElementById('docsLangEn').classList.toggle('active', CV_LANG === 'en')
document.getElementById('docsLangFr').classList.toggle('active', CV_LANG === 'fr')
cvApplyI18n()
void showTab(new URLSearchParams(location.search).get('tab') === 'ask' ? 'ask' : 'apps')
if (window.cvDocs && window.cvDocs.onShowTab) window.cvDocs.onShowTab((tab) => { if (tab === 'ask') void showTab('ask') })
</script>
<script src="ask.js"></script>
</body>
</html>
