<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0f172a"/>
  <!-- Tuning knob / dial -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="#0891b2" stroke-width="2.2"/>
  <!-- Tick marks (optimization search) -->
  <line x1="16" y1="7"  x2="16" y2="9.5"  stroke="#0e7490" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="23" y1="10" x2="21" y2="11.8" stroke="#0e7490" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="25" y1="16" x2="22.5" y2="16" stroke="#0e7490" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="23" y1="22" x2="21"  y2="20.2" stroke="#0e7490" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="9"  y1="10" x2="11" y2="11.8" stroke="#0e7490" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Pointer indicating optimum at top-right -->
  <line x1="16" y1="16" x2="21.5" y2="11.5" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2.2" fill="#06b6d4"/>
  <!-- Sparkle at optimum -->
  <circle cx="22" cy="10" r="1.8" fill="#67e8f9"/>
</svg>
