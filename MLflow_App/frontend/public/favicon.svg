<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0f172a"/>
  <!-- Bar chart -->
  <rect x="5"  y="20" width="4.5" height="7" rx="1" fill="#059669" opacity="0.7"/>
  <rect x="11" y="14" width="4.5" height="13" rx="1" fill="#10b981"/>
  <rect x="17" y="10" width="4.5" height="17" rx="1" fill="#34d399"/>
  <rect x="23" y="16" width="4.5" height="11" rx="1" fill="#10b981" opacity="0.8"/>
  <!-- Trend line -->
  <polyline points="7.25,18 13.25,12 19.25,8 25.25,14" stroke="#6ee7b7" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dots on trend -->
  <circle cx="7.25"  cy="18" r="1.5" fill="#a7f3d0"/>
  <circle cx="13.25" cy="12" r="1.5" fill="#a7f3d0"/>
  <circle cx="19.25" cy="8"  r="1.5" fill="#a7f3d0"/>
  <circle cx="25.25" cy="14" r="1.5" fill="#a7f3d0"/>
</svg>
